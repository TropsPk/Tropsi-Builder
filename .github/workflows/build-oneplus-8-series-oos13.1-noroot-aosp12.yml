name: Build OnePlus 8 Series (OxygenOS 13 A13) - No Root - AOSP Clang 12

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "oneplus_8_cn"
  DEVICE_CODENAME : "instantnoodle"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LLVM=1 LLVM_IAS=1"

  KERNEL_SOURCE : "https://github.com/TropsPk/Tropsi_X_Kernel_SM8250"
  KERNEL_BRANCH : "test"

  CLANG_SOURCE : "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b1.tar.gz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/kona-perf_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  # FIX: Fetch the files to bypass the hardcoded folder crash
  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "bakasu"

  SUSFS_ENABLE : false
  SUSFS_FIXED : true

  AK3_SOURCE : "https://github.com/TropsPk/OP8_AnyKernel3.git"
  AK3_BRANCH : "main"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "oxygen13.1_a13"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"

  # FIX: "only" skips compiling KSU into the kernel, keeping it disabled but satisfying the script
  KERNELSU_METHOD: "only"

  PATCHES_SOURCE: "TropsPk/OnePlus-Kernel-Stuff"
  PATCHES_BRANCH: "fix-susfs"

  SUSFS_FOLDER_FIXED: "Stock"
  SUSFS_PATCH_FIXED: "susfs_fix_4.19.157"
  SUSFS_FIX_MERGE: "false" # Enable if a hunk fails even though your fix patch has it, to merge the fix into the SUSFS patch.

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  HOOK_METHOD: "syscall"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "true"
  MERGE_CONFIG_FILES: "vendor/debugfs.config"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: OnePlus 8 Series (OxygenOS 13 A13) - AOSP Clang 12
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏ Upload Artifacts
        uses: ./.github/workflows/upload-files
