name: Sync Jack Fixes (cherry-pick from upstream)

# Self-tracking sync: remembers the last upstream commit it looked at and
# which commits conflict, so you don't re-enter a date or SHA list every
# run. Just click "Run workflow" going forward.
#
# How the state works:
#   .github/sync-state/last-synced-sha       -> last upstream commit examined
#   .github/sync-state/skipped-commits.txt   -> commits that conflicted,
#                                                permanently skipped from now on
# Both files live in your repo and get committed via the PR this workflow
# opens, so merge that PR each time to advance the state.

on:
  workflow_dispatch:
    inputs:
      bootstrap_since_date:
        description: "First run only (no saved state yet): pull upstream commits after this date (YYYY-MM-DD). Ignored on later runs."
        required: false
        default: ""
      retry_commits:
        description: "Optional: comma-separated SHAs to give another try even though they were previously skipped"
        required: false
        default: ""
      upstream_branch:
        description: "Branch on the upstream repo to pull from"
        required: true
        default: "mainline"
      target_branch:
        description: "Branch in YOUR repo to base the PR on (leave blank = default branch)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Determine target branch
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.target_branch }}" ]; then
            echo "branch=${{ github.event.inputs.target_branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ github.event.repository.default_branch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream "$UPSTREAM_REPO" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch upstream "${{ github.event.inputs.upstream_branch }}"

      - name: Create sync branch
        id: syncbranch
        run: |
          BRANCH="sync/jack-fixes-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Cherry-pick new upstream commits and update state
        id: pick
        run: |
          set -e
          STATE_DIR=".github/sync-state"
          LAST_SYNCED_FILE="$STATE_DIR/last-synced-sha"
          SKIPPED_FILE="$STATE_DIR/skipped-commits.txt"
          mkdir -p "$STATE_DIR"
          touch "$SKIPPED_FILE"

          UPSTREAM_BRANCH="${{ github.event.inputs.upstream_branch }}"
          BOOTSTRAP_DATE="${{ github.event.inputs.bootstrap_since_date }}"
          RETRY_INPUT="${{ github.event.inputs.retry_commits }}"

          declare -A RETRY_SET
          IFS=',' read -ra RETRY_ARR <<< "$RETRY_INPUT"
          for r in "${RETRY_ARR[@]}"; do
            rt=$(echo "$r" | xargs)
            [ -n "$rt" ] && RETRY_SET["$rt"]=1
          done

          declare -A SKIP_SET
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            sha=$(echo "$line" | awk '{print $1}')
            [ -z "$sha" ] && continue
            if [ -z "${RETRY_SET[$sha]:-}" ]; then
              SKIP_SET["$sha"]=1
            fi
          done < "$SKIPPED_FILE"

          if [ -s "$LAST_SYNCED_FILE" ]; then
            LAST_SYNCED=$(tr -d '[:space:]' < "$LAST_SYNCED_FILE")
            echo "Resuming after $LAST_SYNCED"
            COMMITS=$(git log "${LAST_SYNCED}..upstream/${UPSTREAM_BRANCH}" --no-merges --reverse --pretty=format:"%H")
          else
            if [ -z "$BOOTSTRAP_DATE" ]; then
              echo "::error::No sync state yet. Run once with 'bootstrap_since_date' set (YYYY-MM-DD) to start."
              exit 1
            fi
            echo "No prior state — bootstrapping from $BOOTSTRAP_DATE"
            COMMITS=$(git log "upstream/${UPSTREAM_BRANCH}" --since="$BOOTSTRAP_DATE" --no-merges --reverse --pretty=format:"%H")
          fi

          : > /tmp/applied.md
          : > /tmp/skipped.md

          if [ -z "$COMMITS" ]; then
            echo "Nothing new upstream."
            echo "applied=0" >> "$GITHUB_OUTPUT"
            echo "new_skips=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          APPLIED=0
          NEW_SKIPS=0
          NEWEST=""

          for sha in $COMMITS; do
            NEWEST="$sha"
            SUBJECT=$(git log -1 --format=%s "$sha")

            if [ -n "${SKIP_SET[$sha]:-}" ]; then
              echo "Skipping known-conflicting $sha"
              continue
            fi

            echo "Cherry-picking $sha ($SUBJECT)"
            if git cherry-pick -x "$sha"; then
              APPLIED=$((APPLIED+1))
              echo "- \`${sha:0:10}\` $SUBJECT" >> /tmp/applied.md
              grep -v "^${sha} " "$SKIPPED_FILE" > "${SKIPPED_FILE}.tmp" 2>/dev/null || true
              mv "${SKIPPED_FILE}.tmp" "$SKIPPED_FILE" 2>/dev/null || true
            else
              git cherry-pick --abort || true
              echo "Conflict on $sha — recording as permanently skipped"
              grep -v "^${sha} " "$SKIPPED_FILE" > "${SKIPPED_FILE}.tmp" 2>/dev/null || true
              mv "${SKIPPED_FILE}.tmp" "$SKIPPED_FILE" 2>/dev/null || true
              echo "$sha $SUBJECT" >> "$SKIPPED_FILE"
              NEW_SKIPS=$((NEW_SKIPS+1))
              echo "- \`${sha:0:10}\` $SUBJECT" >> /tmp/skipped.md
            fi
          done

          echo "$NEWEST" > "$LAST_SYNCED_FILE"

          echo "applied=$APPLIED" >> "$GITHUB_OUTPUT"
          echo "new_skips=$NEW_SKIPS" >> "$GITHUB_OUTPUT"

      - name: Build PR body
        if: steps.pick.outputs.applied != '0' || steps.pick.outputs.new_skips != '0'
        run: |
          {
            echo "Synced upstream \`${{ github.event.inputs.upstream_branch }}\` from JackA1ltman/NonGKI_Kernel_Build_2nd."
            echo ""
            echo "**Applied (${{ steps.pick.outputs.applied }}):**"
            if [ -s /tmp/applied.md ]; then cat /tmp/applied.md; else echo "_none_"; fi
            echo ""
            echo "**Skipped due to conflict (${{ steps.pick.outputs.new_skips }} new):**"
            if [ -s /tmp/skipped.md ]; then cat /tmp/skipped.md; else echo "_none new_"; fi
            echo ""
            echo "Skipped commits are saved in \`.github/sync-state/skipped-commits.txt\` and won't be retried automatically."
            echo "To give one another try later, pass its SHA via the **retry_commits** input on a future run."
            echo ""
            echo "Merge this PR to advance the sync state, even if 0 were applied — otherwise the next run rechecks the same range."
          } > /tmp/pr-body.md

      - name: Open pull request
        if: steps.pick.outputs.applied != '0' || steps.pick.outputs.new_skips != '0'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.syncbranch.outputs.branch }}
          base: ${{ steps.vars.outputs.branch }}
          commit-message: "sync: update sync-state after Jack fixes sync"
          title: "Sync: Jack's fixes (${{ steps.pick.outputs.applied }} applied, ${{ steps.pick.outputs.new_skips }} newly skipped)"
          body-path: /tmp/pr-body.md
